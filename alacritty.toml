[terminal]
shell = { program = "pwsh", args = ["-NoExit", "-Command", "Set-Location ~; zellij"] }

[window]
dimensions = { columns = 140, lines = 30 }
decorations = "transparent"
blur = true
padding = { x = 4, y = 0 }
option_as_alt = "Both"

[font]
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
size = 12

[general]
import = ["themes/jblowtorch.toml"]

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"
